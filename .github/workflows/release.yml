# Pushing a tag like v1.2.0 builds a universal StockBar DMG and publishes it as a GitHub release.
# A tag with a suffix, like v3.0.0-beta-1, is published as a pre-release (never marked "Latest").
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macOS 26 SDK: Apple Intelligence (FoundationModels) is compiled out with older Xcodes.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # build number = commit count

      - name: Build DMG
        env:
          # Optional: a stable signing certificate, so "Always Allow" on the Keychain prompt survives updates.
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh --dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" build/StockBar-*.dmg "${prerelease[@]}" \
            --title "StockBar ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --generate-notes
